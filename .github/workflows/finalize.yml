name: finalize-and-verify

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - .github/workflows/finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      BASE_TAG: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Unpack task
        run: |
          set -euo pipefail
          rm -rf task out logs
          mkdir -p task out logs
          echo "Files in the repository:"
          find . -path ./.git -prune -o -type f -print | head -50
          Z=$(find . -path ./.git -prune -o -maxdepth 3 -type f -iname '*.zip' -print | head -n 1)
          if [ -z "$Z" ]; then
            echo "ERROR: no .zip file found in the repository. Upload the task ZIP (do not unzip it) with Add file > Upload files."
            exit 1
          fi
          echo "Using ZIP: $Z"
          unzip -q "$Z" -d task
          if [ ! -f task/task.toml ]; then
            T=$(find task -maxdepth 2 -name task.toml | head -n 1)
            if [ -z "$T" ]; then echo "ERROR: task.toml not found inside the ZIP"; exit 1; fi
            D=$(dirname "$T")
            mv "$D" task_inner
            rm -rf task
            mv task_inner task
          fi
          test -f task/task.toml
          test -f task/instruction.md
          ls task

      - name: Resolve base image digest
        id: digest
        run: |
          set -euo pipefail
          docker pull "$BASE_TAG" > /dev/null
          D=$(docker buildx imagetools inspect "$BASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if ! [[ "$D" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "unexpected digest: $D"; exit 1; fi
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "Base image digest: $D" | tee logs/digest.txt

      - name: Generate package-lock.json inside the pinned image
        run: |
          set -euo pipefail
          IMG="${BASE_TAG}@${{ steps.digest.outputs.digest }}"
          docker run --rm -v "$PWD/task/environment/app:/w" -w /w "$IMG" \
            npm install --package-lock-only --no-audit --no-fund
          sudo chown -R "$(id -u):$(id -g)" task
          test -s task/environment/app/package-lock.json
          cp task/environment/app/package-lock.json task/tests/project/package-lock.json
          cmp task/environment/app/package.json task/tests/project/package.json

      - name: Rewrite Dockerfiles (digest, lockfile, npm ci)
        run: |
          set -euo pipefail
          D="${{ steps.digest.outputs.digest }}"
          sed -i "s|sha256:REPLACE_WITH_PINNED_DIGEST|${D}|" task/environment/Dockerfile task/tests/Dockerfile
          sed -i 's|COPY app/package.json /app/package.json|COPY app/package.json app/package-lock.json /app/|; s|npm install --no-audit --no-fund|npm ci --no-audit --no-fund|' task/environment/Dockerfile
          sed -i 's|COPY project/package.json /verify/package.json|COPY project/package.json project/package-lock.json /verify/|; s|npm install --no-audit --no-fund|npm ci --no-audit --no-fund|' task/tests/Dockerfile
          if grep -q REPLACE_WITH task/environment/Dockerfile task/tests/Dockerfile; then echo "placeholder remains"; exit 1; fi
          head -1 task/environment/Dockerfile | grep -q harbor-canary
          head -1 task/tests/Dockerfile | grep -q harbor-canary
          cat task/environment/Dockerfile task/tests/Dockerfile | tee logs/dockerfiles.txt
          (cd task && zip -qr ../out/anchored-virtual-grid-final.zip .)

      - name: Build agent and verifier images
        run: |
          set -euo pipefail
          docker build -t grid-agent task/environment 2>&1 | tee logs/build-agent.txt
          docker build -t grid-verifier task/tests 2>&1 | tee logs/build-verifier.txt

      - name: Oracle run (solve.sh must lead to reward 1)
        run: |
          set -uo pipefail
          docker rm -f agent > /dev/null 2>&1 || true
          docker run -d --name agent -v "$PWD/task/solution:/solution:ro" grid-agent sleep 3600 > /dev/null
          docker exec agent bash /solution/solve.sh
          mkdir -p out/oracle-grid
          docker cp agent:/app/src/grid/. out/oracle-grid/
          docker exec -w /app agent npx tsc --noEmit > logs/oracle-tsc.txt 2>&1 || echo "tsc reported issues (non-blocking)"
          docker exec -w /app agent npm run build > logs/oracle-build.txt 2>&1 || { cat logs/oracle-build.txt; exit 1; }
          mkdir -p logs/oracle
          docker run --rm --ipc=host \
            -v "$PWD/out/oracle-grid:/app/src/grid:ro" -v "$PWD/logs/oracle:/logs/verifier" \
            grid-verifier bash /tests/test.sh > logs/oracle-stdout.txt 2>&1 || true
          tail -60 logs/oracle-stdout.txt
          R=$(cat logs/oracle/reward.txt)
          echo "ORACLE_REWARD=$R" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$R" = "1" ] || [ "$R" = "1.0" ]

      - name: Nop run (empty agent must score 0)
        run: |
          set -uo pipefail
          docker rm -f nop > /dev/null 2>&1 || true
          docker create --name nop grid-agent > /dev/null
          mkdir -p out/nop-grid logs/nop
          docker cp nop:/app/src/grid/. out/nop-grid/
          docker run --rm --ipc=host \
            -v "$PWD/out/nop-grid:/app/src/grid:ro" -v "$PWD/logs/nop:/logs/verifier" \
            grid-verifier bash /tests/test.sh > logs/nop-stdout.txt 2>&1 || true
          tail -30 logs/nop-stdout.txt
          R=$(cat logs/nop/reward.txt)
          echo "NOP_REWARD=$R" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$R" = "0" ] || [ "$R" = "0.0" ]

      - name: Negative controls (these must all score 0)
        run: |
          set -uo pipefail
          run_v() {
            name="$1"; grid="$2"
            mkdir -p "logs/$name"
            docker run --rm --ipc=host \
              -v "$PWD/$grid:/app/src/grid:ro" -v "$PWD/logs/$name:/logs/verifier" \
              grid-verifier bash /tests/test.sh > "logs/$name-stdout.txt" 2>&1 || true
            cat "logs/$name/reward.txt"
          }
          rm -rf out/mut-leak out/mut-nof2 out/mut-ties
          cp -r out/oracle-grid out/mut-leak
          printf "import t from '../../../tests/e2e/grid.spec.ts?raw';\nexport const leak = t;\n" > out/mut-leak/leak.ts
          echo "export { leak } from './leak';" >> out/mut-leak/index.ts
          cp -r out/oracle-grid out/mut-nof2
          sed -i "/case 'F2':/d" out/mut-nof2/DataGrid.tsx
          cp -r out/oracle-grid out/mut-ties
          sed -i 's/x > y ? d : a - b;/x > y ? d : b - a;/' out/mut-ties/DataGrid.tsx
          grep -q "b - a;" out/mut-ties/DataGrid.tsx
          FAIL=0
          for m in leak nof2 ties; do
            R=$(run_v "mut-$m" "out/mut-$m")
            echo "MUTANT_${m}_REWARD=$R" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$R" != "0" ]; then FAIL=1; fi
          done
          grep -i -m3 "outside the grid\|not allowed" logs/mut-leak/playwright.log || true
          exit $FAIL

      - name: Upload finished ZIP and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalized-task-and-logs
          path: |
            out/anchored-virtual-grid-final.zip
            logs/
          if-no-files-found: warn
